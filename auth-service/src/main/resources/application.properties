server.port=8081
spring.application.name=auth-service

spring.datasource.url=jdbc:postgresql://localhost:5432/courier_auth
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

jwt.secret=aV9hbV9hX3NlY3JldF9rZXlfdGhhdF9pX3VzZV90b19nZW5lcmF0ZV90aGVfdG9rZW5zX2Zvcl90aGlzX2FwcGxpY2F0aW9u
jwt.expirationMs=86400000

management.endpoints.web.exposure.include=*
server.forward-headers-strategy=framework

# Mail Configuration (Update with real credentials)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=your_mailtrap_username
spring.mail.password=your_mailtrap_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Tracing
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]

# Logging to file
logging.file.name=logs/${spring.application.name}.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
