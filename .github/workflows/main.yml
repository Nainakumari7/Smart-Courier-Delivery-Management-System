name: SmartCourier CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and Test Microservices
        run: mvn clean install -DskipTests # Skip tests for initial CI setup speed, change to 'mvn clean install' later
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-courier-frontend/package-lock.json
          
      - name: Build Frontend
        working-directory: ./smart-courier-frontend
        run: |
          npm install
          npm run build

  docker-build-and-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push Microservices
        run: |
          services=("eureka-server" "config-server" "api-gateway" "auth-service" "delivery-service" "tracking-service" "admin-service")
          for service in "${services[@]}"; do
            echo "Building and pushing $service..."
            docker build -t ${{ secrets.DOCKER_USERNAME }}/smartcourier-$service:latest ./$service
            docker push ${{ secrets.DOCKER_USERNAME }}/smartcourier-$service:latest
          done
          
      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/smartcourier-frontend:latest ./smart-courier-frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/smartcourier-frontend:latest
